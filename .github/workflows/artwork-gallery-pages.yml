name: Deploy artwork gallery to GitHub Pages
on:
  # Automatic deploys are paused. This workflow and web-build.yml both publish
  # to the same GitHub Pages site, so any push touching the paths below
  # replaced the playable game at https://mtecfix.github.io/Street-life/ with
  # the artwork gallery. Re-enable once the gallery is published under its
  # own subpath (e.g. /gallery/) inside the web-build Pages artifact.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'artwork-gallery/**'
  #     - 'game/assets/sprites/generated/**'
  #     - '.github/workflows/artwork-gallery-pages.yml'
  # Manual runs are still possible from the Actions tab, but they will also
  # replace the game on Pages until the subpath change above is made.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble gallery site
        run: |
          mkdir -p _site/assets/sprites
          cp artwork-gallery/index.html _site/index.html
          cp -R game/assets/sprites/generated _site/assets/sprites/generated
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
