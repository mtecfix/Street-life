name: Combat Skill Tree Validation

on:
  push:
    branches: ["**"]
    paths:
      - "game/**"
      - ".github/workflows/combat-skill-trees.yml"
  pull_request:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/combat-skill-trees.yml"

permissions:
  contents: read

jobs:
  validate-combat-progression:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import Godot project
        run: godot --headless --path game --editor --quit
      - name: Test progression and save migration
        run: godot --headless --path game --script res://tests/test_progression.gd
      - name: Test combat skill trees
        run: godot --headless --path game --script res://tests/test_combat_skill_trees.gd
      - name: Test combat rules
        run: godot --headless --path game --script res://tests/test_combat_rules.gd
      - name: Test combat skill integration
        run: godot --headless --path game --script res://tests/test_combat_skill_integration.gd
      - name: Test combat scenes
        run: godot --headless --path game --script res://tests/test_combat_scenes.gd
