name: Godot Web Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/web-build.yml"]

concurrency:
  group: street-hustler-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/godot-templates/export_templates.tpz
          unzip -q /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

      - name: Import project
        run: godot --headless --path game --editor --quit

      - name: Run faction standing tests
        run: godot --headless --path game --script res://tests/test_faction_manager.gd

      - name: Run combat environment scene tests
        run: godot --headless --path game --script res://tests/test_combat_scenes.gd

      - name: Run combat attack rules tests
        run: godot --headless --path game --script res://tests/test_combat_rules.gd

      - name: Prepare Web export directory
        run: mkdir -p game/build/web

      - name: Export Web
        run: |
          mkdir -p game/build/web
          godot --headless --path game --export-release "Web" build/web/index.html

      - name: Upload downloadable Web build
        uses: actions/upload-artifact@v4
        with:
          name: street-hustler-web
          path: game/build/web/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web/

  deploy-pages:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
